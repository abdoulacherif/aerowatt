# Active AndroidX (obligatoire pour Material Design et les librairies modernes)
android.useAndroidX=true

# Convertit automatiquement les anciennes librairies vers AndroidX
android.enableJetifier=true

# Active la mise en cache pour accélérer les builds
org.gradle.caching=true

# Utilise Kotlin en mode incrémental (compilation plus rapide)
kotlin.incremental=true