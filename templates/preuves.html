<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AEROWATT — Preuves de retrait</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0066FF;--cyan:#00E5FF;--orange:#FF6B00;--orange2:#FF9A3C;--black:#080E1A;--dark:#0D1827;--bg:#F0F6FF;--muted:#7A9BB5;--border:#E2EBF8;--green:#00B86B}
body{font-family:'Nunito',sans-serif;background:var(--bg);max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.top-bar{background:linear-gradient(135deg,var(--dark),#0A1E3A);padding:16px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.top-title{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:#fff;letter-spacing:2px;flex:1;text-align:center}
.back-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.header-card{margin:16px 16px 0;background:linear-gradient(135deg,var(--dark),#0A1E3A);border-radius:18px;padding:20px;text-align:center;border:1px solid rgba(0,229,255,0.15)}
.header-title{font-family:'Orbitron',monospace;font-size:16px;font-weight:900;color:#fff;margin-bottom:6px}
.header-sub{font-size:12px;color:var(--muted);line-height:1.5}
.stats-row{display:flex;gap:10px;margin:12px 16px 0}
.stat{flex:1;background:#fff;border-radius:14px;padding:14px 8px;text-align:center;border:1px solid var(--border)}
.stat-val{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;margin-bottom:3px}
.stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 16px 0}
.proof-card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--border);cursor:pointer;box-shadow:0 2px 10px rgba(0,102,255,0.06)}
.proof-img{width:100%;height:130px;object-fit:cover}
.proof-body{padding:10px}
.proof-user{font-size:12px;font-weight:800;color:var(--black)}
.proof-amount{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--green);margin:3px 0}
.proof-date{font-size:10px;color:var(--muted)}
.proof-badge{display:inline-block;font-size:9px;font-weight:800;padding:2px 8px;border-radius:10px;background:rgba(0,184,107,0.1);color:var(--green);margin-top:3px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:600;align-items:center;justify-content:center}
.lightbox.show{display:flex}
.lightbox img{max-width:95%;max-height:90vh;border-radius:12px}
.lightbox-close{position:absolute;top:16px;right:16px;width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 6px;gap:3px;cursor:pointer;text-decoration:none}
.nav-lbl{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div class="top-bar">
  <button class="back-btn" onclick="location.href='/dashboard'"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <div class="top-title">PREUVES DE RETRAIT</div>
  <div style="width:34px"></div>
</div>
<div class="header-card">
  <div class="header-title">✅ Retraits Vérifiés</div>
  <div class="header-sub">Tous les retraits sont réels et vérifiés.<br>AEROWATT paie ses membres 24h/7j.</div>
</div>
<div class="stats-row">
  <div class="stat"><div class="stat-val" style="color:var(--green)">2,847</div><div class="stat-lbl">Retraits</div></div>
  <div class="stat"><div class="stat-val" style="color:var(--blue)">98.7%</div><div class="stat-lbl">Succès</div></div>
  <div class="stat"><div class="stat-val" style="color:var(--orange)">24H</div><div class="stat-lbl">Délai max</div></div>
</div>
<div class="grid" id="proofs-grid"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()"><svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg></button>
  <img id="lb-img" src="" alt="">
</div>
<div class="navbar">
  <a class="nav-item" href="/dashboard"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="#7A9BB5"/></svg><span class="nav-lbl">Accueil</span></a>
  <a class="nav-item" href="/revenu"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z" fill="#7A9BB5"/></svg><span class="nav-lbl">Revenu</span></a>
  <a class="nav-item" href="/actualites"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" fill="#7A9BB5"/></svg><span class="nav-lbl">Actualités</span></a>
  <a class="nav-item" href="/equipe"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="#7A9BB5"/></svg><span class="nav-lbl">Équipe</span></a>
  <a class="nav-item" href="/profil"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4-1.8 4-4s-1.3-4-4-4-4 1.8-4 4 1.3 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z" fill="#7A9BB5"/></svg><span class="nav-lbl">Moi</span></a>
</div>
<script>
// ADMIN peut ajouter des preuves ici
const PREUVES=[
  {user:"@74****228",montant:"80,000 XAF",date:"12 Jun 2026",methode:"Orange Money",img:"https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=400&q=80"},
  {user:"@91****043",montant:"50,000 XAF",date:"11 Jun 2026",methode:"Wave",img:"https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?w=400&q=80"},
  {user:"@55****382",montant:"125,000 XAF",date:"10 Jun 2026",methode:"MTN Money",img:"https://images.unsplash.com/photo-1559526324-4b87b5e36e44?w=400&q=80"},
  {user:"@68****711",montant:"35,000 XAF",date:"9 Jun 2026",methode:"Orange Money",img:"https://images.unsplash.com/photo-1601597111158-2fceff292cdc?w=400&q=80"},
  {user:"@83****519",montant:"200,000 XAF",date:"8 Jun 2026",methode:"Wave",img:"https://images.unsplash.com/photo-1554224154-26032ffc0d07?w=400&q=80"},
  {user:"@47****901",montant:"15,000 XAF",date:"7 Jun 2026",methode:"Moov Money",img:"https://images.unsplash.com/photo-1563013544-824ae1b704d3?w=400&q=80"},
];
const g=document.getElementById('proofs-grid');
PREUVES.forEach(p=>{
  g.innerHTML+=`<div class="proof-card" onclick="openLightbox('${p.img}')">
    <img class="proof-img" src="${p.img}" alt="">
    <div class="proof-body">
      <div class="proof-user">${p.user}</div>
      <div class="proof-amount">${p.montant}</div>
      <div class="proof-date">${p.date}</div>
      <span class="proof-badge">✅ ${p.methode}</span>
    </div>
  </div>`;
});
function openLightbox(src){document.getElementById('lb-img').src=src;document.getElementById('lightbox').classList.add('show');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show');}
</script>
</body>
</html>
