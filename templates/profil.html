<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AEROWATT — Profil</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0066FF;--cyan:#00E5FF;--orange:#FF6B00;--orange2:#FF9A3C;--black:#080E1A;--dark:#0D1827;--white:#fff;--bg:#F0F6FF;--muted:#7A9BB5;--border:#E2EBF8;--green:#00B86B}
body{font-family:'Nunito',sans-serif;background:var(--bg);max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.top-bar{background:linear-gradient(135deg,var(--dark),#0A1E3A);padding:16px 18px;display:flex;align-items:center;gap:12px}
.top-title{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:#fff;letter-spacing:2px;flex:1;text-align:center}
.back-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hero-profil{background:linear-gradient(135deg,var(--dark),#0A1E3A);padding:24px 18px;text-align:center;border-bottom:1px solid rgba(0,229,255,0.1)}
.avatar-wrap{position:relative;width:90px;height:90px;margin:0 auto 14px}
.avatar-circle{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;border:3px solid rgba(0,229,255,0.3);font-family:'Orbitron',monospace;font-size:28px;font-weight:900;color:#fff}
.user-name{font-size:18px;font-weight:800;color:#fff;margin-bottom:4px}
.user-tel{font-size:13px;color:var(--muted);margin-bottom:12px}
.user-since{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:1px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 16px 0}
.stat-box{background:#fff;border-radius:14px;padding:14px 8px;text-align:center;border:1px solid var(--border)}
.stat-box-val{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;margin-bottom:3px}
.stat-box-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.section{margin:16px 16px 0;background:#fff;border-radius:18px;border:1px solid var(--border);overflow:hidden}
.section-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.section-header-title{font-size:14px;font-weight:800;color:var(--black)}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:var(--bg)}
.menu-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mi-blue{background:rgba(0,102,255,0.1)}
.mi-orange{background:rgba(255,107,0,0.1)}
.mi-green{background:rgba(0,184,107,0.1)}
.mi-red{background:rgba(255,59,48,0.1)}
.menu-label{font-size:14px;font-weight:700;color:var(--black);flex:1}
.menu-val{font-size:12px;color:var(--muted);font-weight:600}
.menu-arrow{color:var(--muted)}
.logout-btn{margin:16px 16px 0;width:calc(100% - 32px);padding:15px;background:linear-gradient(135deg,#FF3B30,#FF6B6B);border:none;border-radius:14px;color:#fff;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 6px;gap:3px;cursor:pointer;text-decoration:none}
.nav-lbl{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav-item.active .nav-lbl{color:var(--blue)}
.nav-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);display:none}
.nav-item.active .nav-dot{display:block}
</style>
</head>
<body>

<script>
const token=localStorage.getItem('token');

async function init(){
  if(!token){ location.href='/'; return; }
  try {
    const r = await fetch('/api/me',{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok){ localStorage.clear(); location.href='/'; return; }
    const u = await r.json();
    const nom = u.nom || 'Utilisateur';
    const tel = u.telephone || '+235 XX XX XX';
    const code = u.mon_code || 'AW-000000';
    const solde = u.solde || 0;

    document.getElementById('stat-solde').textContent = solde.toLocaleString();
    document.getElementById('user-name').textContent = nom;
    document.getElementById('user-tel').textContent = tel;
    document.getElementById('avatar-initials').textContent = nom.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2) || 'AW';
    document.getElementById('info-nom').textContent = nom;
    document.getElementById('info-tel').textContent = tel;
    document.getElementById('info-code').textContent = code;

    if(u.created_at){
      const d = new Date(u.created_at);
      const mois = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
      document.getElementById('user-since').textContent = 'Membre depuis '+mois[d.getMonth()]+' '+d.getFullYear();
    }

    // Gains totaux et filleuls, via l'endpoint /api/equipe (parrainage réel)
    try {
      const re = await fetch('/api/equipe', {headers:{'Authorization':'Bearer '+token}});
      if(re.ok){
        const eq = await re.json();
        document.getElementById('stat-gains').textContent = (eq.gains?.total||0).toLocaleString();
        document.getElementById('stat-filleuls').textContent = (eq.filleuls||[]).length;
      }
    } catch(e) { console.log('Erreur chargement équipe:', e); }
  } catch(e) {
    console.log('Erreur chargement profil:', e);
  }
}

function deconnexion(){
  if(confirm('Voulez-vous vraiment vous déconnecter ?')){
    localStorage.clear();
    location.href='/';
  }
}

init();
</script>
