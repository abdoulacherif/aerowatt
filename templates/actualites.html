<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AEROWATT — Actualités</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0066FF;--cyan:#00E5FF;--orange:#FF6B00;--orange2:#FF9A3C;--black:#080E1A;--dark:#0D1827;--white:#fff;--bg:#F0F6FF;--muted:#7A9BB5;--border:#E2EBF8;--green:#00B86B}
body{font-family:'Nunito',sans-serif;background:var(--bg);max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.top-bar{background:linear-gradient(135deg,var(--dark),#0A1E3A);padding:16px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.top-title{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:#fff;letter-spacing:2px;flex:1;text-align:center}
.back-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ticker{background:var(--dark);padding:9px 16px;display:flex;align-items:center;gap:10px;overflow:hidden}
.ticker-track{overflow:hidden;flex:1}
.ticker-text{font-size:12px;color:rgba(255,255,255,0.8);white-space:nowrap;display:inline-block;animation:scroll 20s linear infinite;font-weight:600}
@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-600px)}}
.cats{display:flex;gap:8px;padding:14px 16px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-btn{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0}
.cat-btn.active{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border-color:transparent}
.featured{margin:0 16px 16px;border-radius:20px;overflow:hidden;position:relative;box-shadow:0 8px 30px rgba(0,102,255,0.15);cursor:pointer}
.featured img{width:100%;height:200px;object-fit:cover;filter:brightness(0.6)}
.featured-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,14,26,0.9) 0%,transparent 60%)}
.featured-content{position:absolute;bottom:0;left:0;right:0;padding:16px}
.featured-badge{display:inline-flex;align-items:center;gap:5px;background:var(--orange);color:#fff;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;margin-bottom:8px}
.featured-title{font-size:17px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:6px}
.featured-meta{font-size:11px;color:rgba(255,255,255,0.65)}
.news-list{padding:0 16px}
.news-card{background:#fff;border-radius:16px;margin-bottom:12px;border:1px solid var(--border);overflow:hidden;cursor:pointer;box-shadow:0 2px 12px rgba(0,102,255,0.06)}
.news-card.pinned{border-color:var(--orange)}
.news-inner{display:flex}
.news-img{width:110px;height:100px;object-fit:cover;flex-shrink:0}
.news-body{flex:1;padding:12px}
.news-badges{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:800;padding:2px 8px;border-radius:10px}
.badge-update{background:rgba(0,102,255,0.1);color:var(--blue)}
.badge-alerte{background:rgba(255,107,0,0.1);color:var(--orange)}
.badge-promo{background:rgba(0,184,107,0.1);color:var(--green)}
.badge-pinned{background:rgba(255,107,0,0.15);color:var(--orange)}
.news-title{font-size:13px;font-weight:800;color:var(--black);line-height:1.3;margin-bottom:4px}
.news-excerpt{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:6px}
.news-meta{font-size:10px;color:var(--muted)}
.detail-ov{display:none;position:fixed;inset:0;background:rgba(8,14,26,0.7);z-index:400;align-items:flex-end;justify-content:center}
.detail-ov.show{display:flex}
.detail-box{background:#fff;border-radius:24px 24px 0 0;padding:0;width:100%;max-width:430px;animation:slideUp .35s ease;max-height:88vh;overflow-y:auto;position:relative}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.detail-img{width:100%;height:200px;object-fit:cover}
.detail-content{padding:20px}
.detail-title{font-size:19px;font-weight:900;color:var(--black);margin-bottom:8px;line-height:1.3}
.detail-meta{font-size:11px;color:var(--muted);margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.detail-body{font-size:14px;color:#3A4A5A;line-height:1.7}
.detail-body p{margin-bottom:12px}
.detail-close{position:absolute;top:14px;right:14px;width:34px;height:34px;background:rgba(0,0,0,0.4);border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 6px;gap:3px;cursor:pointer;text-decoration:none}
.nav-lbl{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav-item.active .nav-lbl{color:var(--blue)}
.nav-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);display:none}
.nav-item.active .nav-dot{display:block}
</style>
</head>
<body>
<div class="top-bar">
  <button class="back-btn" onclick="location.href='/dashboard'"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <div class="top-title">ACTUALITÉS</div>
  <div style="width:34px"></div>
</div>
<div class="ticker">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="#FF9A3C"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
  <div class="ticker-track"><span class="ticker-text" id="ticker-txt">Chargement...</span></div>
</div>
<div class="cats" id="cats">
  <button class="cat-btn active" onclick="filterCat('all',this)">Tout</button>
  <button class="cat-btn" onclick="filterCat('update',this)">Mises à jour</button>
  <button class="cat-btn" onclick="filterCat('alerte',this)">Alertes</button>
  <button class="cat-btn" onclick="filterCat('promo',this)">Promotions</button>
  <button class="cat-btn" onclick="filterCat('info',this)">Infos</button>
</div>
<div class="featured" id="featured-section" style="display:none" onclick="openFeatured()">
  <img id="featured-img" src="" alt="">
  <div class="featured-overlay"></div>
  <div class="featured-content">
    <div class="featured-badge">⭐ À LA UNE</div>
    <div class="featured-title" id="featured-title"></div>
    <div class="featured-meta" id="featured-meta"></div>
  </div>
</div>
<div class="news-list" id="news-list"></div>
<div class="detail-ov" id="detail-ov" onclick="if(event.target===this)closeDetail()">
  <div class="detail-box">
    <button class="detail-close" onclick="closeDetail()"><svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg></button>
    <img class="detail-img" id="d-img" src="" alt="">
    <div class="detail-content">
      <div id="d-badges" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"></div>
      <div class="detail-title" id="d-title"></div>
      <div class="detail-meta" id="d-meta"></div>
      <div class="detail-body" id="d-body"></div>
    </div>
  </div>
</div>
<div class="navbar">
  <a class="nav-item" href="/dashboard"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="#7A9BB5"/></svg><span class="nav-lbl">Accueil</span></a>
  <a class="nav-item" href="/revenu"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z" fill="#7A9BB5"/></svg><span class="nav-lbl">Revenu</span></a>
  <a class="nav-item active" href="/actualites"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" fill="#0066FF"/></svg><span class="nav-lbl">Actualités</span><div class="nav-dot"></div></a>
  <a class="nav-item" href="/equipe"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="#7A9BB5"/></svg><span class="nav-lbl">Équipe</span></a>
  <a class="nav-item" href="/profil"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4-1.8 4-4s-1.3-4-4-4-4 1.8-4 4 1.3 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z" fill="#7A9BB5"/></svg><span class="nav-lbl">Moi</span></a>
</div>
<script>
const ACTUALITES=[
  {id:1,titre:"🎉 Lancement officiel d'AEROWATT !",excerpt:"La plateforme d'investissement éolien #1 en Afrique de l'Ouest est maintenant disponible.",contenu:"<p>Nous sommes ravis d'annoncer le lancement officiel d'AEROWATT, la première plateforme d'investissement dans les éoliennes dédiée à l'Afrique de l'Ouest.</p><p>Avec AEROWATT, vous pouvez investir dès 4,000 XAF et commencer à générer des revenus quotidiens.</p><p><strong>Bienvenue dans la révolution énergétique africaine !</strong></p>",categorie:"info",image:"https://images.unsplash.com/photo-1548337138-e87d889cc369?w=600&q=80",date:"12 Juin 2026",auteur:"Équipe AEROWATT",une:true,epingle:true},
  {id:2,titre:"⚡ Nouveau plan Éolienne Elite 500W !",excerpt:"Un nouveau plan d'investissement premium vient d'être ajouté.",contenu:"<p>Nous présentons notre nouveau plan <strong>Éolienne Elite 500W</strong>.</p><p>Rendement quotidien de <strong>19,200 XAF</strong> pour 350,000 XAF sur 90 jours.</p><p>Seulement 10 slots disponibles !</p>",categorie:"update",image:"https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?w=600&q=80",date:"11 Juin 2026",auteur:"Admin AEROWATT",une:false,epingle:false},
  {id:3,titre:"🎁 Promotion parrainage : 20% de commission !",excerpt:"Invitez vos amis et gagnez 20% de commission sur chaque dépôt.",contenu:"<p>Pour célébrer notre lancement, nous offrons <strong>20% de commission</strong> sur chaque dépôt de vos filleuls.</p><p>Partagez votre code maintenant !</p>",categorie:"promo",image:"https://images.unsplash.com/photo-1466611653911-95081537e5b7?w=600&q=80",date:"10 Juin 2026",auteur:"Admin AEROWATT",une:false,epingle:false},
  {id:4,titre:"⚠️ Maintenance prévue le 15 Juin 2026",excerpt:"Maintenance technique de 02h à 05h. Dépôts et retraits suspendus.",contenu:"<p>Maintenance prévue le <strong>15 Juin 2026 de 02h à 05h WAT</strong>.</p><p>Dépôts et retraits suspendus durant cette période.</p>",categorie:"alerte",image:"https://images.unsplash.com/photo-1467533003447-e295ff1b0435?w=600&q=80",date:"9 Juin 2026",auteur:"Admin AEROWATT",une:false,epingle:true}
];
let featuredNews=null;
function init(){
  featuredNews=ACTUALITES.find(n=>n.une);
  if(featuredNews){
    document.getElementById('featured-section').style.display='block';
    document.getElementById('featured-img').src=featuredNews.image;
    document.getElementById('featured-title').textContent=featuredNews.titre;
    document.getElementById('featured-meta').textContent=featuredNews.date+' · '+featuredNews.auteur;
  }
  document.getElementById('ticker-txt').textContent=ACTUALITES.map(n=>n.titre).join(' · ');
  renderNews(ACTUALITES);
}
function renderNews(list){
  const c=document.getElementById('news-list');c.innerHTML='';
  list.forEach(n=>{
    const bc={'update':'badge-update','alerte':'badge-alerte','promo':'badge-promo','info':'badge-update'}[n.categorie]||'badge-update';
    const bl={'update':'Mise à jour','alerte':'Alerte','promo':'Promotion','info':'Info'}[n.categorie]||'Info';
    c.innerHTML+=`<div class="news-card${n.epingle?' pinned':''}" onclick="openDetail(${n.id})">
      <div class="news-inner">
        <img class="news-img" src="${n.image}" alt="">
        <div class="news-body">
          <div class="news-badges">${n.epingle?'<span class="badge badge-pinned">📌 Épinglé</span>':''}<span class="badge ${bc}">${bl}</span></div>
          <div class="news-title">${n.titre}</div>
          <div class="news-excerpt">${n.excerpt}</div>
          <div class="news-meta">${n.date} · ${n.auteur}</div>
        </div>
      </div>
    </div>`;
  });
}
function filterCat(cat,btn){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderNews(cat==='all'?ACTUALITES:ACTUALITES.filter(n=>n.categorie===cat));
}
function openFeatured(){if(featuredNews)openDetail(featuredNews.id);}
function openDetail(id){
  const n=ACTUALITES.find(a=>a.id===id);if(!n)return;
  document.getElementById('d-img').src=n.image;
  document.getElementById('d-title').textContent=n.titre;
  document.getElementById('d-meta').textContent=n.date+' · '+n.auteur;
  document.getElementById('d-body').innerHTML=n.contenu;
  const bc={'update':'badge-update','alerte':'badge-alerte','promo':'badge-promo','info':'badge-update'}[n.categorie]||'badge-update';
  const bl={'update':'Mise à jour','alerte':'Alerte','promo':'Promotion','info':'Info'}[n.categorie]||'Info';
  document.getElementById('d-badges').innerHTML=`<span class="badge ${bc}">${bl}</span>${n.epingle?'<span class="badge badge-pinned">📌 Épinglé</span>':''}`;
  document.getElementById('detail-ov').classList.add('show');
}
function closeDetail(){document.getElementById('detail-ov').classList.remove('show');}
init();
</script>
</body>
</html>
