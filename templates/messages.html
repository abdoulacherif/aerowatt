<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AEROWATT — Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0066FF;--cyan:#00E5FF;--orange:#FF6B00;--orange2:#FF9A3C;--black:#080E1A;--dark:#0D1827;--white:#fff;--bg:#F0F6FF;--muted:#7A9BB5;--border:#E2EBF8;--green:#00B86B}
body{font-family:'Nunito',sans-serif;background:var(--bg);max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top-bar{background:linear-gradient(135deg,var(--dark),#0A1E3A);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.top-title{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:#fff;letter-spacing:2px;flex:1;text-align:center}
.back-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tabs{display:flex;background:var(--dark);border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0}
.tab{flex:1;padding:13px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.tab-badge{background:var(--orange);color:#fff;font-size:9px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.panel{display:none;flex:1;flex-direction:column;overflow:hidden}
.panel.active{display:flex}
.notifs-list{flex:1;overflow-y:auto;padding:12px 16px 100px}
.notif-item{background:#fff;border-radius:16px;margin-bottom:10px;border:1px solid var(--border);overflow:hidden;cursor:pointer}
.notif-item.unread{border-left:4px solid var(--blue)}
.notif-item.unread-orange{border-left:4px solid var(--orange)}
.notif-header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.notif-icon-wrap{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ni-blue{background:rgba(0,102,255,0.1)}
.ni-orange{background:rgba(255,107,0,0.1)}
.ni-green{background:rgba(0,184,107,0.1)}
.notif-title{font-size:13px;font-weight:800;color:var(--black)}
.notif-time{font-size:10px;color:var(--muted);margin-top:2px}
.notif-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-left:auto;flex-shrink:0}
.notif-body{padding:0 14px 12px;font-size:12px;color:#3A4A5A;line-height:1.6}
.notif-img{width:100%;max-height:180px;object-fit:cover;border-radius:0 0 12px 12px;display:block}
.empty-notifs{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-header{background:#fff;padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center}
.chat-name{font-size:14px;font-weight:800;color:var(--black)}
.chat-status{font-size:11px;color:var(--green);display:flex;align-items:center;gap:4px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
.chat-messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:88%}
.msg.admin{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg-bubble{padding:10px 14px;border-radius:18px;font-size:13px;line-height:1.5;max-width:100%}
.msg.admin .msg-bubble{background:#fff;color:var(--black);border-radius:4px 18px 18px 18px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.msg.user .msg-bubble{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border-radius:18px 18px 4px 18px}
.msg-img{width:100%;max-width:220px;border-radius:12px;display:block;margin-top:4px;cursor:pointer}
.msg-time{font-size:9px;color:var(--muted);margin-top:4px}
.msg.admin .msg-time{text-align:left}
.msg.user .msg-time{text-align:right}
.msg-name{font-size:10px;font-weight:800;color:var(--blue);margin-bottom:3px}
.date-sep{text-align:center;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1px;padding:4px 12px;background:rgba(122,155,181,0.1);border-radius:20px;align-self:center;margin:4px 0}
.typing{display:flex;align-items:center;gap:4px;padding:8px 14px;background:#fff;border-radius:18px;width:fit-content;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typingDot 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typingDot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.chat-input-wrap{padding:10px 16px;background:#fff;border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:10px;flex-shrink:0}
.chat-input{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:22px;padding:10px 16px;font-family:'Nunito',sans-serif;font-size:14px;color:var(--black);outline:none;resize:none;max-height:100px;line-height:1.4}
.chat-input:focus{border-color:var(--cyan)}
.chat-input::placeholder{color:#C0CEDF}
.attach-btn{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.send-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 4px 14px rgba(0,102,255,0.35)}
.send-btn:active{transform:scale(0.92)}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:600;align-items:center;justify-content:center}
.lightbox.show{display:flex}
.lightbox img{max-width:95%;max-height:90vh;border-radius:12px}
.lightbox-close{position:absolute;top:16px;right:16px;width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 6px;gap:3px;cursor:pointer;text-decoration:none}
.nav-lbl{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div class="top-bar">
  <button class="back-btn" onclick="location.href='/dashboard'"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <div class="top-title">MESSAGES</div>
  <div style="width:34px"></div>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('notifs',this)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6V11c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
    Notifications<span class="tab-badge" id="notif-badge">0</span>
  </div>
  <div class="tab" onclick="switchTab('chat',this)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    Support Chat
  </div>
</div>
<div class="panel active" id="panel-notifs">
  <div class="notifs-list" id="notifs-list"><div class="empty-notifs">Chargement...</div></div>
</div>
<div class="panel" id="panel-chat">
  <div class="chat-wrap">
    <div class="chat-header">
      <div class="chat-avatar"><svg width="20" height="20" viewBox="0 0 64 64" fill="none"><path d="M32 32L32 6Q36 19 32 32Z" fill="white"/><path d="M32 32L54 46Q41 37 32 32Z" fill="rgba(255,107,0,0.9)"/><circle cx="32" cy="32" r="4" fill="white"/></svg></div>
      <div><div class="chat-name">Support AEROWATT</div><div class="chat-status"><div class="status-dot"></div>En ligne · répond rapidement</div></div>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="sendImage(event)">
      <button class="attach-btn" onclick="document.getElementById('file-input').click()"><svg width="18" height="18" viewBox="0 0 24 24" fill="#7A9BB5"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18zM17 11h-4v4h-2v-4H7V9h4V5h2v4h4v2z"/></svg></button>
      <textarea class="chat-input" id="msg-input" placeholder="Écrivez votre message..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMsg()"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close"><svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg></button>
  <img id="lightbox-img" src="" alt="">
</div>
<div class="navbar">
  <a class="nav-item" href="/dashboard"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="#7A9BB5"/></svg><span class="nav-lbl">Accueil</span></a>
  <a class="nav-item" href="/revenu"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z" fill="#7A9BB5"/></svg><span class="nav-lbl">Revenu</span></a>
  <a class="nav-item" href="/actualites"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" fill="#7A9BB5"/></svg><span class="nav-lbl">Actualités</span></a>
  <a class="nav-item" href="/equipe"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="#7A9BB5"/></svg><span class="nav-lbl">Équipe</span></a>
  <a class="nav-item" href="/profil"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4-1.8 4-4s-1.3-4-4-4-4 1.8-4 4 1.3 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z" fill="#7A9BB5"/></svg><span class="nav-lbl">Moi</span></a>
</div>
<script>
const SUPABASE_URL='https://qybvdpxtermlmgpgqaqt.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5YnZkcHh0ZXJtbG1ncGdxYXF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MjA5NjUsImV4cCI6MjA5NjQ5Njk2NX0.dw5Z_hFCa1odg4ZWM6ylq_6UGilZ7xMEnYXws559yMk';
let NOTIFICATIONS=[];
let unreadNotifs=0;

async function loadNotifications(){
  const token=localStorage.getItem('token');
  if(!token){location.href='/';return;}
  try{
    const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+token}});
    const u=await r.json();
    const rn=await fetch(SUPABASE_URL+'/rest/v1/notifications?user_id=eq.'+u.id+'&order=created_at.desc',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    const data=await rn.json();
    NOTIFICATIONS=(data||[]).map(n=>({
      id:n.id,titre:n.titre,corps:n.corps,
      image:n.image_url,type:n.type,
      date:new Date(n.created_at).toLocaleString('fr'),lu:n.lu
    }));
  }catch(e){console.log('offline notifs', e);}
  unreadNotifs=NOTIFICATIONS.filter(n=>!n.lu).length;
  renderNotifs();
  renderChat();
}

const CHAT_MESSAGES=[
  {role:'admin',text:"👋 Bonjour ! Bienvenue sur AEROWATT. Comment puis-je vous aider ?",time:"08:00",img:null},
  {role:'admin',text:"Notre équipe est disponible 24h/7j pour vos questions.",time:"08:00",img:null}
];
let messages=[...CHAT_MESSAGES];

function switchTab(tab,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab==='chat')setTimeout(scrollChat,100);
}

function renderNotifs(){
  const c=document.getElementById('notifs-list');
  const badge=document.getElementById('notif-badge');
  badge.textContent=unreadNotifs;
  badge.style.display=unreadNotifs===0?'none':'flex';
  if(!NOTIFICATIONS.length){
    c.innerHTML='<div class="empty-notifs">Aucune notification pour le moment.</div>';
    return;
  }
  c.innerHTML='';
  const icons={info:'<svg width="20" height="20" viewBox="0 0 24 24" fill="#0066FF"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>',update:'<svg width="20" height="20" viewBox="0 0 24 24" fill="#FF6B00"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>',promo:'<svg width="20" height="20" viewBox="0 0 24 24" fill="#FF9A3C"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',alerte:'<svg width="20" height="20" viewBox="0 0 24 24" fill="#FF6B00"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>'};
  NOTIFICATIONS.forEach(n=>{
    const bg={info:'ni-blue',update:'ni-orange',promo:'ni-orange',alerte:'ni-orange'}[n.type]||'ni-blue';
    const bc=!n.lu?(n.type==='info'?'unread':'unread-orange'):'';
    c.innerHTML+=`<div class="notif-item ${bc}" onclick="markRead('${n.id}')">
      <div class="notif-header">
        <div class="notif-icon-wrap ${bg}">${icons[n.type]||icons.info}</div>
        <div style="flex:1"><div class="notif-title">${n.titre}</div><div class="notif-time">${n.date}</div></div>
        ${!n.lu?'<div class="notif-unread-dot"></div>':''}
      </div>
      <div class="notif-body">${n.corps}</div>
      ${n.image?`<img class="notif-img" src="${n.image}" onclick="event.stopPropagation();openLightbox('${n.image}')">`:''}
    </div>`;
  });
}

// Corrigé : la lecture est maintenant persistée sur Supabase (avant : uniquement en mémoire locale,
// donc tout redevenait "non lu" au moindre rechargement de page)
async function markRead(id){
  const n=NOTIFICATIONS.find(n=>String(n.id)===String(id));
  if(!n || n.lu) return;
  n.lu=true;
  unreadNotifs=Math.max(0, unreadNotifs-1);
  renderNotifs();
  try{
    await fetch(SUPABASE_URL+'/rest/v1/notifications?id=eq.'+id,{
      method:'PATCH',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({lu:true})
    });
  }catch(e){ console.log('Erreur marquage lu:', e); }
}

function renderChat(){
  const c=document.getElementById('chat-messages');c.innerHTML='';
  messages.forEach(m=>{
    const isAdmin=m.role==='admin';
    c.innerHTML+=`<div class="msg ${isAdmin?'admin':'user'}">
      ${isAdmin?`<div class="msg-avatar"><svg width="16" height="16" viewBox="0 0 64 64" fill="none"><path d="M32 32L32 6Q36 19 32 32Z" fill="white"/><circle cx="32" cy="32" r="4" fill="white"/></svg></div>`:''}
      <div>${isAdmin?'<div class="msg-name">Support AEROWATT</div>':''}
        <div class="msg-bubble">${m.text||''}${m.img?`<img class="msg-img" src="${m.img}" onclick="openLightbox('${m.img}')">`:''}
        </div><div class="msg-time">${m.time}</div>
      </div>
    </div>`;
  });
  scrollChat();
}
function scrollChat(){const c=document.getElementById('chat-messages');c.scrollTop=c.scrollHeight;}
function sendMsg(){
  const input=document.getElementById('msg-input');const text=input.value.trim();if(!text)return;
  const now=new Date();const time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  messages.push({role:'user',text,time,img:null});input.value='';input.style.height='auto';renderChat();
  setTimeout(()=>{
    const c=document.getElementById('chat-messages');
    const el=document.createElement('div');el.className='msg admin';
    el.innerHTML='<div class="msg-avatar"><svg width="16" height="16" viewBox="0 0 64 64" fill="none"><path d="M32 32L32 6Q36 19 32 32Z" fill="white"/><circle cx="32" cy="32" r="4" fill="white"/></svg></div><div class="typing"><span></span><span></span><span></span></div>';
    c.appendChild(el);scrollChat();
    setTimeout(()=>{el.remove();const replies=["Merci pour votre message ! Nous traitons votre demande.","Bien reçu ! Un conseiller vous répondra sous peu.","Nous avons pris note. Merci de nous faire confiance."];messages.push({role:'admin',text:replies[Math.floor(Math.random()*replies.length)],time,img:null});renderChat();},2000);
  },500);
}
function sendImage(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{const now=new Date();const time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');messages.push({role:'user',text:'',time,img:e.target.result});renderChat();setTimeout(()=>{messages.push({role:'admin',text:"Image reçue ! Nous allons l'examiner.",time,img:null});renderChat();},1500);};
  reader.readAsDataURL(file);event.target.value='';
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
function openLightbox(src){document.getElementById('lightbox-img').src=src;document.getElementById('lightbox').classList.add('show');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show');}
loadNotifications();
</script>
</body>
</html>
