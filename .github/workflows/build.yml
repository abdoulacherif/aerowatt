name: Build & Test LOCAFRIC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compilation et tests
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code du dépôt
      - name: Récupération du code
        uses: actions/checkout@v4

      # 2. Installe Java (nécessaire pour Kotlin/Gradle)
      - name: Installation de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Installe Gradle directement (pas besoin de gradlew)
      - name: Installation de Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # 4. Compile le module partagé (logique commune Android + iOS)
      - name: Compilation du module partagé
        run: gradle :shared:build

      # 5. Compile l'application Android
      - name: Compilation de l'application Android
        run: gradle :androidApp:assembleDebug

      # 6. Lance les tests automatiques
      - name: Exécution des tests
        run: gradle test

# 7. Rend l'APK téléchargeable depuis l'onglet Actions
      - name: Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: locafric-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk